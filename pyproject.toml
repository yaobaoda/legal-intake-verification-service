[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-signup"
version = "0.1.0"
description = "Email verification for a legal intake workflow"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.116.1",
    "pydantic[email]==2.11.7",
    "uvicorn==0.35.0",
]

[tool.setuptools.packages.find]
include = ["legal_signup*"]

[tool.pytest.ini_options]
pythonpath = ["."]
